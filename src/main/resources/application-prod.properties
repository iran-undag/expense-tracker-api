# SQL Server configuration (prod profile)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=expensedb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# validate schema, do not create or update tables automatically in production
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_IDLE_TIMEOUT:300000}
spring.datasource.hikari.data-source-properties.loginTimeout=${SPRING_DATASOURCE_LOGIN_TIMEOUT:120}
spring.datasource.hikari.data-source-properties.connectRetryCount=${SPRING_DATASOURCE_CONNECT_RETRY_COUNT:5}
spring.datasource.hikari.data-source-properties.connectRetryInterval=${SPRING_DATASOURCE_CONNECT_RETRY_INTERVAL:15}

# Demo SQL Server configuration (initialized lazily on first demo session request)
demo.datasource.url=${DEMO_DATASOURCE_URL:}
demo.datasource.username=${DEMO_DATASOURCE_USERNAME:}
demo.datasource.password=${DEMO_DATASOURCE_PASSWORD:}
demo.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
demo.datasource.hikari.maximum-pool-size=${DEMO_DATASOURCE_MAX_POOL_SIZE:3}
demo.datasource.hikari.minimum-idle=0
demo.datasource.hikari.idle-timeout=${DEMO_DATASOURCE_IDLE_TIMEOUT:300000}
demo.datasource.hikari.data-source-properties.loginTimeout=${DEMO_DATASOURCE_LOGIN_TIMEOUT:30}
demo.datasource.hikari.data-source-properties.connectRetryCount=${DEMO_DATASOURCE_CONNECT_RETRY_COUNT:1}
demo.datasource.hikari.data-source-properties.connectRetryInterval=${DEMO_DATASOURCE_CONNECT_RETRY_INTERVAL:10}
demo.token-hmac-key=${DEMO_TOKEN_HMAC_KEY:}

# Disable H2 console in prod
spring.h2.console.enabled=false

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:9000/oauth2/jwks}
app.cors.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}

management.health.db.enabled=false
