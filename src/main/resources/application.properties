spring.application.name=expense-tracker-api
server.port=8081

# Receipt Processor Toggle (values: azure, ollama, or openvino)
receipt.processor.provider=${AI_PROVIDER:ollama}

# Azure Document AI Configuration
azure.documentintelligence.endpoint=${AZURE_DOCUMENT_AI_ENDPOINT:}
azure.documentintelligence.key=${AZURE_DOCUMENT_AI_KEY:}

# Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=gemma4:e2b

# OpenVINO Vision API Configuration
openvino.vision.base-url=${OPENVINO_BASE_URL:http://localhost:8001}
openvino.vision.chat-path=${OPENVINO_CHAT_PATH:/api/vision/chat}

# Logging Configuration
logging.level.com.example.expensetracker=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/expense-tracker.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# OpenAPI Metadata
springdoc.openapi.info.title=Expense Tracker API
springdoc.openapi.info.version=1.0.0
springdoc.openapi.info.description=API for managing expenses with AI-powered receipt processing.

# Actuator Endpoints
management.endpoints.web.exposure.include=health,prometheus
