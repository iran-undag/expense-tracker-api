spring.application.name=expense-tracker-api
server.port=8081

# Receipt Processor Toggle (values: ollama, openvino, or azure; azure calls the external receipt processor function)
receipt.processor.provider=${AI_PROVIDER:ollama}

# Azure Receipt Processor Function Configuration
receipt.processor.azure-function.url=${RECEIPT_PROCESSOR_URL:http://localhost:7071/api/process-receipt}
receipt.processor.azure-function.key=${RECEIPT_PROCESSOR_FUNCTION_KEY:}

# Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_OPTIONS_MODEL:gemma4:e2b}

# OpenVINO Vision API Configuration
openvino.vision.base-url=${OPENVINO_BASE_URL:http://localhost:8001}
openvino.vision.chat-path=${OPENVINO_CHAT_PATH:/api/vision/chat}

# Logging Configuration
logging.level.com.example.expensetracker=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-}] - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-}] - %msg%n

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# OpenAPI Metadata
springdoc.openapi.info.title=Expense Tracker API
springdoc.openapi.info.version=1.0.0
springdoc.openapi.info.description=API for managing expenses with AI-powered receipt processing.

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Maximum allowed size for a single uploaded file
spring.servlet.multipart.max-file-size=4MB

# Maximum allowed size for the entire multipart/form-data request
spring.servlet.multipart.max-request-size=5MB
