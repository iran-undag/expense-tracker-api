name: Trigger auto deployment for ca-expense-tracker-api

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/ca-expense-tracker-api-AutoDeployTrigger-c388fc82-d3ca-4e0c-aa69-97b26dceb0c4.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAEXPENSETRACKERAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAEXPENSETRACKERAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAEXPENSETRACKERAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CAEXPENSETRACKERAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAEXPENSETRACKERAPI_REGISTRY_PASSWORD }}
          containerAppName: ca-expense-tracker-api
          resourceGroup: rg-expense-tracker
          imageToBuild: ghcr.io/${{ github.repository_owner }}/ca-expense-tracker-api:${{ github.sha }}
          targetPort: 8081
          ingress: external
