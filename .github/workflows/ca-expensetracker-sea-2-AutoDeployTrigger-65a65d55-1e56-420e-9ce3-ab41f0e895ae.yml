name: Trigger auto deployment for ca-expensetracker-sea-2

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-expensetracker-sea-2-AutoDeployTrigger-65a65d55-1e56-420e-9ce3-ab41f0e895ae.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAEXPENSETRACKERSEA2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAEXPENSETRACKERSEA2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAEXPENSETRACKERSEA2_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CAEXPENSETRACKERSEA2_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAEXPENSETRACKERSEA2_REGISTRY_PASSWORD }}
          containerAppName: ca-expensetracker-sea-2
          resourceGroup: rg-expensetracker-sea
          imageToBuild: ghcr.io/ca-expensetracker-sea-2:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


