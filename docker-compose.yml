services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Example!Passw0rd}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:-Example!Passw0rd}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expensetracker-net

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Example!Passw0rd}
    command:
      - /bin/sh
      - -c
      - |
        until /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "${MSSQL_SA_PASSWORD:-Example!Passw0rd}" -C -Q "SELECT 1"; do
          sleep 2;
        done;
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "${MSSQL_SA_PASSWORD:-Example!Passw0rd}" -C -Q "IF DB_ID(N'expensedb') IS NULL CREATE DATABASE expensedb"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expensetracker-net

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      JWK_SET_URI: ${JWK_SET_URI:-http://host.docker.internal:9000/oauth2/jwks}
      ALLOWED_ORIGIN_PATTERNS: ${ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=expensedb;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:-Example!Passw0rd}
      SPRING_DATASOURCE_MAX_POOL_SIZE: ${SPRING_DATASOURCE_MAX_POOL_SIZE:-5}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENVINO_BASE_URL: ${OPENVINO_BASE_URL:-http://host.docker.internal:8001}
      OPENVINO_CHAT_PATH: ${OPENVINO_CHAT_PATH:-/api/vision/chat}
      RECEIPT_PROCESSOR_URL: ${RECEIPT_PROCESSOR_URL:-http://host.docker.internal:7071/api/process-receipt}
      RECEIPT_PROCESSOR_FUNCTION_KEY: ${RECEIPT_PROCESSOR_FUNCTION_KEY:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - expensetracker-net

volumes:
  sqldata:

networks:
  expensetracker-net:
    driver: bridge
