services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expensetracker-net

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:9000}
      ALLOWED_ORIGIN_PATTERNS: ${ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/expensedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: example
      SPRING_DATASOURCE_MAX_POOL_SIZE: ${SPRING_DATASOURCE_MAX_POOL_SIZE:-5}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENVINO_BASE_URL: ${OPENVINO_BASE_URL:-http://host.docker.internal:8001}
      OPENVINO_CHAT_PATH: ${OPENVINO_CHAT_PATH:-/api/vision/chat}
      AZURE_DOCUMENT_AI_ENDPOINT: ${AZURE_DOCUMENT_AI_ENDPOINT:-}
      AZURE_DOCUMENT_AI_KEY: ${AZURE_DOCUMENT_AI_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - expensetracker-net

volumes:
  pgdata:

networks:
  expensetracker-net:
    driver: bridge
